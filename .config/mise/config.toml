min_version = "2026.7.7"

[bootstrap.packages]
"apt:bash-completion" = "latest"
"apt:curl" = "latest"
"apt:git" = "latest"

[tools]
# global tool versions go here
# you can set these with `mise use -g`
# https://github.com/jdx/mise/blob/main/registry.toml

lsd = "1.1.5"
bat = "0.25.0"
delta = "0.18.2"
ripgrep = "14.1.1"
fd = "10.2.0"
dust = "1.2.0"
zoxide = "0.9.9"
xh = "0.24.1"
gitui = "0.27.0"
zellij = "0.42.2"
fzf = "0.62.0"
pinact = "3.1.1"
carapace = "1.6.3"
"aqua:dalance/procs" = "0.14.10"
"aqua:bvaisvil/zenith" = "0.14.1"
"sheldon" = { version = "0.8.5", postinstall = "sheldon lock" }
fnox = "1.20.0"
"ni" = "30.1.0"
python = "3.13.3"
node = "24.18.0"
go = "1.24.2"
bun = "1.2.13"
deno = "2.3.1"
rust = "stable"
aube = "1.8.0"
shfmt = "3.12.0"
shellcheck = "0.11.0"
codex = "0.152.0"
claude-code = "2.1.126"
copilot = "1.0.40"
just = "1.50.0"
usage = "6.6.1"
ghq = "1.10.1"
apm = "0.29.0"
herdr = "0.8.2"

[settings]
idiomatic_version_file_enable_tools = ["node"]

[dotfiles]
# Configurations
"~/.config" = { source = "..", mode = "symlink" }
"~/.gitconfig" = { source = "../../.gitconfig", mode = "symlink" }

# Bash
#"~/.bashrc" = { source = "../../.bashrc", mode = "symlink" }

# Zsh
"~/.p10k.zsh" = { source = "../../.p10k.zsh", mode = "symlink" }
"~/.zfunc" = { source = "../../.zfunc", mode = "symlink" }
"~/.zshenv" = { source = "../../.zshenv", mode = "symlink" }
"~/.zshrc" = { source = "../../.zshrc", mode = "symlink" }

# Common shell settings
"~/.aliases.sh" = { source = "../../.aliases.sh", mode = "symlink" }
"~/.envs.sh" = { source = "../../.envs.sh", mode = "symlink" }
"~/.interactive_tools.sh" = { source = "../../.interactive_tools.sh", mode = "symlink" }
